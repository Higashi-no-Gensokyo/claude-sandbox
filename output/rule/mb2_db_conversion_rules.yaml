      - { name: body_properties_age,             xsd_attr: "face/BodyProperties@age",           type: VARCHAR(255), nullable: true }
      - { name: body_properties_weight,          xsd_attr: "face/BodyProperties@weight",        type: VARCHAR(255), nullable: true }
      - { name: body_properties_build,           xsd_attr: "face/BodyProperties@build",         type: VARCHAR(255), nullable: true }
      - { name: body_properties_key,             xsd_attr: "face/BodyProperties@key",           type: VARCHAR(255), nullable: true }
      - { name: body_properties_max_version,     xsd_attr: "face/BodyPropertiesMax@version",    type: VARCHAR(255), nullable: true }
      - { name: body_properties_max_age,         xsd_attr: "face/BodyPropertiesMax@age",        type: VARCHAR(255), nullable: true }
      - { name: body_properties_max_weight,      xsd_attr: "face/BodyPropertiesMax@weight",     type: VARCHAR(255), nullable: true }
      - { name: body_properties_max_build,       xsd_attr: "face/BodyPropertiesMax@build",      type: VARCHAR(255), nullable: true }
      - { name: body_properties_max_key,         xsd_attr: "face/BodyPropertiesMax@key",        type: VARCHAR(255), nullable: true }
      - { name: face_key_template_value,         xsd_attr: "face/face_key_template@value",      type: VARCHAR(255), nullable: true }
      - { name: body_properties_template_value,  xsd_attr: "face/BodyPropertiesTemplate@value", type: VARCHAR(255), nullable: true, note: "書式: BodyProperty.xxx" }

