      - { name: race,                           xsd_attr: race,                           type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: is_basic_troop,                 xsd_attr: is_basic_troop,                 type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: is_template,                    xsd_attr: is_template,                    type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: is_child_template,              xsd_attr: is_child_template,              type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: is_hidden_encyclopedia,         xsd_attr: is_hidden_encyclopedia,         type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: face_mesh_cache,                xsd_attr: face_mesh_cache,                type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: is_obsolete,                    xsd_attr: is_obsolete,                    type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: culture,                        xsd_attr: culture,                        type: VARCHAR(255), nullable: false,            xsd_use: required, note: "書式: Culture.xxx" }
      - { name: name,                           xsd_attr: name,                           type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: banner_symbol_mesh_name,        xsd_attr: banner_symbol_mesh_name,        type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: banner_symbol_color,            xsd_attr: banner_symbol_color,            type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
