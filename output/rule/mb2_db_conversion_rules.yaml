    source_path: NPCCharacters/NPCCharacter/Components/Lord
    relationship: "1:N"
    parent: npc_characters
    note: >
      Lord要素はid属性に加え関係固有の属性を持つ。
      xs:choiceによりCompanionとは別テーブルとして分離。
    primary_key: [npc_character_id, lord_id]
    columns:
      - { name: npc_character_id, type: VARCHAR(255), nullable: false, pk_order: 1, fk: npc_characters.id }
      - { name: lord_id,          xsd_attr: id,       type: VARCHAR(255), nullable: false, pk_order: 2, fk: npc_characters.id, note: "自己参照" }
