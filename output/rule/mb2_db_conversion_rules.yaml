    source_xsd: Heroes.xsd
    source_path: Heroes/Hero
    relationship: root
    columns:
      - { name: id,                            xsd_attr: id,                            type: VARCHAR(255), nullable: false, pk: true,  xsd_use: required }
      - { name: father,                        xsd_attr: father,                        type: VARCHAR(255), nullable: true,             xsd_use: optional, fk: heroes.id, note: "自己参照" }
      - { name: mother,                        xsd_attr: mother,                        type: VARCHAR(255), nullable: true,             xsd_use: optional, fk: heroes.id, note: "自己参照" }
      - { name: faction,                       xsd_attr: faction,                       type: VARCHAR(255), nullable: false,            xsd_use: required, fk: factions.id }
      - { name: banner_key,                    xsd_attr: banner_key,                    type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: spouse,                        xsd_attr: spouse,                        type: VARCHAR(255), nullable: true,             xsd_use: optional, fk: heroes.id, note: "自己参照" }
      - { name: alive,                         xsd_attr: alive,                         type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: text,                          xsd_attr: text,                          type: TEXT,         nullable: true,             xsd_use: optional }
      - { name: preferred_upgrade_formation,   xsd_attr: preferred_upgrade_formation,   type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: banner_item,                   xsd_attr: banner_item,                   type: VARCHAR(255), nullable: true,             xsd_use: optional }

