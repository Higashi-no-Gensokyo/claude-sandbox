      - { name: text,             xsd_attr: text,     type: TEXT,         nullable: true }
      - { name: spouse,           xsd_attr: spouse,   type: VARCHAR(255), nullable: true }
      - { name: alive,            xsd_attr: alive,    type: VARCHAR(255), nullable: true }
      - { name: voice,            xsd_attr: voice,    type: VARCHAR(255), nullable: true }
      - { name: father,           xsd_attr: father,   type: VARCHAR(255), nullable: true }
      - { name: mother,           xsd_attr: mother,   type: VARCHAR(255), nullable: true }
      - { name: faction,          xsd_attr: faction,  type: VARCHAR(255), nullable: true, note: "書式: Faction.xxx" }
      - { name: clan,             xsd_attr: clan,     type: VARCHAR(255), nullable: true, note: "書式: Clan.xxx" }

  # ---------------------------------------------------------------------------
  - name: npc_character_companions
    source_xsd: NPCCharacters.xsd
    source_path: NPCCharacters/NPCCharacter/Components/Companion
    relationship: "1:N"
    parent: npc_characters
    note: >
      Companion要素はid属性のみを持ち、npc_characters.idへの自己参照。
      xs:choiceによりLordとは別テーブルとして分離。
    primary_key: [npc_character_id, companion_id]
    columns:
      - { name: npc_character_id, type: VARCHAR(255), nullable: false, pk_order: 1, fk: npc_characters.id }
      - { name: companion_id,     xsd_attr: id,       type: VARCHAR(255), nullable: false, pk_order: 2, fk: npc_characters.id, note: "自己参照" }

