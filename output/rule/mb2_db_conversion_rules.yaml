      - { name: owner,                    xsd_attr: owner,                    type: VARCHAR(255), nullable: true,             xsd_use: optional, fk: heroes.id, note: "書式: Hero.xxx" }
      - { name: primary_banner_color,     xsd_attr: primary_banner_color,     type: VARCHAR(255), nullable: false,            xsd_use: required, note: "書式: 0xRRGGBBAA" }
      - { name: secondary_banner_color,   xsd_attr: secondary_banner_color,   type: VARCHAR(255), nullable: false,            xsd_use: required, note: "書式: 0xRRGGBBAA" }
      - { name: color,                    xsd_attr: color,                    type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: color2,                   xsd_attr: color2,                   type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: culture,                  xsd_attr: culture,                  type: VARCHAR(255), nullable: false,            xsd_use: required, fk: cultures.id, note: "書式: Culture.xxx" }
      - { name: settlement_banner_mesh,   xsd_attr: settlement_banner_mesh,   type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: flag_mesh,                xsd_attr: flag_mesh,                type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: name,                     xsd_attr: name,                     type: VARCHAR(255), nullable: false,            xsd_use: required }
      - { name: short_name,               xsd_attr: short_name,               type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: text,                     xsd_attr: text,                     type: TEXT,         nullable: true,             xsd_use: optional }
      - { name: title,                    xsd_attr: title,                    type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: ruler_title,              xsd_attr: ruler_title,              type: VARCHAR(255), nullable: true,             xsd_use: optional }

  # ---------------------------------------------------------------------------
  - name: kingdom_relationships
    source_xsd: Kingdoms.xsd
    source_path: Kingdoms/Kingdom/relationships/relationship
    relationship: "1:N"   # <xs:sequence>内でmaxOccurs="unbounded"
    parent: kingdoms
    surrogate_key: true   # clan/kingdomがともにNULL許容のため複合PKに使用不可
    columns:
      - { name: id,          type: INT AUTO_INCREMENT, nullable: false, pk: true }
      - { name: kingdom_id,  type: VARCHAR(255),       nullable: false, fk: kingdoms.id }
      - { name: clan,        xsd_attr: clan,           type: VARCHAR(255), nullable: true, note: "書式: Faction.xxx" }
      - { name: kingdom_ref, xsd_attr: kingdom,        type: VARCHAR(255), nullable: true, note: "書式: Kingdom.xxx" }
      - { name: value,       xsd_attr: value,          type: INT,          nullable: false }
      - { name: is_at_war,   xsd_attr: isAtWar,        type: BOOLEAN,      nullable: true }

  # ---------------------------------------------------------------------------
  - name: kingdom_policies
    source_xsd: Kingdoms.xsd
    source_path: Kingdoms/Kingdom/policies/policy
    relationship: "1:N"
    parent: kingdoms
    primary_key: [kingdom_id, policy_id]
    columns:
      - { name: kingdom_id, type: VARCHAR(255), nullable: false, pk_order: 1, fk: kingdoms.id }
      - { name: policy_id,  xsd_attr: id,       type: VARCHAR(255), nullable: false, pk_order: 2 }

  # ---------------------------------------------------------------------------
  - name: cultures
    source_xsd: SPCultures.xsd
    source_path: SPCultures/Culture
    relationship: root
    columns:
      - { name: id,                                       xsd_attr: id,                                       type: VARCHAR(255), nullable: false, pk: true,  xsd_use: required }
      - { name: name,                                     xsd_attr: name,                                     type: VARCHAR(255), nullable: false,            xsd_use: required }
      - { name: color,                                    xsd_attr: color,                                    type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: color2,                                   xsd_attr: color2,                                   type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: is_main_culture,                          xsd_attr: is_main_culture,                          type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: is_bandit,                                xsd_attr: is_bandit,                                type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: naval_factor,                             xsd_attr: naval_factor,                             type: FLOAT,        nullable: true,             xsd_use: optional }
      - { name: can_have_settlement,                      xsd_attr: can_have_settlement,                      type: BOOLEAN,      nullable: true,             xsd_use: optional }
      - { name: militia_bonus,                            xsd_attr: militia_bonus,                            type: INT,          nullable: true,             xsd_use: optional }
      - { name: prosperity_bonus,                         xsd_attr: prosperity_bonus,                         type: INT,          nullable: true,             xsd_use: optional }
      - { name: encounter_background_mesh,                xsd_attr: encounter_background_mesh,                type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: faction_banner_key,                       xsd_attr: faction_banner_key,                       type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: basic_troop,                              xsd_attr: basic_troop,                              type: VARCHAR(255), nullable: false,            xsd_use: required }
      - { name: elite_basic_troop,                        xsd_attr: elite_basic_troop,                        type: VARCHAR(255), nullable: false,            xsd_use: required }
      - { name: board_game_type,                          xsd_attr: board_game_type,                          type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: default_battle_equipment_roster,          xsd_attr: default_battle_equipment_roster,          type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: default_civilian_equipment_roster,        xsd_attr: default_civilian_equipment_roster,        type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: default_stealth_equipment_roster,         xsd_attr: default_stealth_equipment_roster,         type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: duel_preset_equipment_roster,             xsd_attr: duel_preset_equipment_roster,             type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: marriage_bride_equipment_roster,          xsd_attr: marriage_bride_equipment_roster,          type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: text,                                     xsd_attr: text,                                     type: TEXT,         nullable: true,             xsd_use: optional }
      - { name: default_character_creation_body_property, xsd_attr: default_character_creation_body_property, type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: start_point_position_x,                  xsd_attr: start_point_position_x,                   type: FLOAT,        nullable: true,             xsd_use: optional }
      - { name: start_point_position_y,                  xsd_attr: start_point_position_y,                   type: FLOAT,        nullable: true,             xsd_use: optional }

  # ---------------------------------------------------------------------------
  - name: culture_npc_roles
    source_xsd: SPCultures.xsd
    source_path: "SPCultures/Culture@[role_attrs]"
    relationship: "1:N"
    parent: cultures
    primary_key: [culture_id, role_name]
    note: >
      XSD上は約60個の独立属性だが正規化のため縦持ち化。
      role_nameはXSD属性名をそのまま使用。
    columns:
      - { name: culture_id,  type: VARCHAR(255), nullable: false, pk_order: 1, fk: cultures.id }
      - { name: role_name,   type: VARCHAR(255), nullable: false, pk_order: 2 }
      - { name: npc_id,      type: VARCHAR(255), nullable: false }

