      - { name: initial_home_settlement,  xsd_attr: initial_home_settlement,  type: VARCHAR(255),  nullable: false,            xsd_use: required, note: "書式: Settlement.xxx" }
      - { name: banner_key,               xsd_attr: banner_key,               type: VARCHAR(255),  nullable: true,             xsd_use: optional }
      - { name: tier,                     xsd_attr: tier,                     type: DECIMAL(10,2), nullable: false,            xsd_use: required }
      - { name: owner,                    xsd_attr: owner,                    type: VARCHAR(255),  nullable: true,             xsd_use: optional, fk: heroes.id, note: "書式: Hero.xxx" }
      - { name: color,                    xsd_attr: color,                    type: VARCHAR(255),  nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: color2,                   xsd_attr: color2,                   type: VARCHAR(255),  nullable: true,             xsd_use: optional, note: "書式: 0xRRGGBBAA" }
      - { name: culture,                  xsd_attr: culture,                  type: VARCHAR(255),  nullable: true,             xsd_use: optional, fk: cultures.id, note: "書式: Culture.xxx" }
      - { name: super_faction,            xsd_attr: super_faction,            type: VARCHAR(255),  nullable: true,             xsd_use: optional, fk: kingdoms.id, note: "書式: Kingdom.xxx" }
