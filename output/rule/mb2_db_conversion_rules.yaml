      - { name: is_nomad,                 xsd_attr: is_nomad,                 type: BOOLEAN,       nullable: true,             xsd_use: optional }
      - { name: is_sect,                  xsd_attr: is_sect,                  type: BOOLEAN,       nullable: true,             xsd_use: optional }
