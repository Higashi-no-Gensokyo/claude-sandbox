      - { name: occupation,                     xsd_attr: occupation,                     type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: is_companion,                   xsd_attr: is_companion,                   type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: offset,                         xsd_attr: offset,                         type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: level,                          xsd_attr: level,                          type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: age,                            xsd_attr: age,                            type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: is_mercenary,                   xsd_attr: is_mercenary,                   type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: formation_position_preference,  xsd_attr: formation_position_preference,  type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: default_equipment_set,          xsd_attr: default_equipment_set,          type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: skill_template,                 xsd_attr: skill_template,                 type: VARCHAR(255), nullable: true,             xsd_use: optional }
      - { name: upgrade_requires,               xsd_attr: upgrade_requires,               type: VARCHAR(255), nullable: true,             xsd_use: optional, note: "書式: ItemCategory.xxx" }

