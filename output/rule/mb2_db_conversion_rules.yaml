      - { name: value,            xsd_attr: value,    type: INT,          nullable: false }

  # ---------------------------------------------------------------------------
  - name: npc_character_traits
    source_xsd: NPCCharacters.xsd
    source_path: NPCCharacters/NPCCharacter/Traits/Trait
    relationship: "1:N"
    parent: npc_characters
    primary_key: [npc_character_id, trait_id]
    columns:
      - { name: npc_character_id, type: VARCHAR(255), nullable: false, pk_order: 1, fk: npc_characters.id }
      - { name: trait_id,         xsd_attr: id,       type: VARCHAR(255), nullable: false, pk_order: 2 }
