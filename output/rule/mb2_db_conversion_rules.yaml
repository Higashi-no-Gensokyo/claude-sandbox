  - { name: culture_banner_bearer_replacement_weapons,      source_xsd: SPCultures.xsd, source_path: "SPCultures/Culture/banner_bearer_replacement_weapons/item",                       relationship: "1:N", parent: cultures, primary_key: [culture_id, item_id],     columns: [{name: culture_id, type: VARCHAR(255), nullable: false, pk_order: 1, fk: cultures.id}, {name: item_id,     xsd_attr: id, type: VARCHAR(255), nullable: false, pk_order: 2}] }
