      - { name: name,             xsd_attr: name,     type: VARCHAR(255), nullable: false, pk_order: 2 }

  # ---------------------------------------------------------------------------
  - name: npc_character_skills
    source_xsd: NPCCharacters.xsd
    source_path: NPCCharacters/NPCCharacter/skills/skill
