    relationship: "1:N"
    parent: npc_character_equipment_rosters
    surrogate_key: true
    columns:
      - { name: id,                  type: INT AUTO_INCREMENT, nullable: false, pk: true }
      - { name: equipment_roster_id, type: INT,                nullable: false, fk: npc_character_equipment_rosters.id }
      - { name: slot,                xsd_attr: slot,           type: VARCHAR(255), nullable: true }
      - { name: item_id,             xsd_attr: id,             type: VARCHAR(255), nullable: true }
      - { name: amount,              xsd_attr: amount,         type: VARCHAR(255), nullable: true }

