# Mount & Blade II — XSD→MySQL 変換ルール定義
# 用途: このファイルをインプットとして読むことで、XSDファイルの変更時に
#       設計変更箇所と生成すべきDDLを正確に把握できる。
#
# 凡例:
#   pk: true          → PRIMARY KEY
#   pk_order: N       → 複合PKの順序（1始まり）
#   fk: table.column  → FOREIGN KEY 参照先
#   pk_and_fk: true   → PK兼FKの1:1テーブル
#   nullable: false   → NOT NULL
#   nullable: true    → NULL許容
#   xsd_use: required → XSDで use="required"
#   xsd_use: optional → XSDで use="optional"

meta:
  charset: utf8mb4
  collation: utf8mb4_unicode_ci
  boolean_type: BOOLEAN       # TINYINT(1)の別名
  boolean_nullable: true      # XMLで省略された属性とfalseの区別を保持するためNULL許容
  idempotent_ddl: true        # DROP TABLE IF EXISTS + SET FOREIGN_KEY_CHECKS を先頭に出力

type_mapping:
  xs:string:    VARCHAR(255)  # text属性など長文が想定される場合はTEXT
  xs:int:       INT
  xs:decimal:   DECIMAL(10,2)
  xs:float:     FLOAT
  xs:boolean:   BOOLEAN
  enumeration:  ENUM(...)     # XSDのenumeration値をそのまま列挙

