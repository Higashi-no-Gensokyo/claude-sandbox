  - name: npc_character_equipment_sets
    source_xsd: NPCCharacters.xsd
    source_path: NPCCharacters/NPCCharacter/Equipments/EquipmentSet
    relationship: "1:N"
    parent: npc_characters
    primary_key: [npc_character_id, set_id]
    columns:
