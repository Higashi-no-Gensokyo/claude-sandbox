      - { name: clan,       xsd_attr: clan,     type: VARCHAR(255), nullable: true, note: "書式: Faction.xxx" }
      - { name: kingdom,    xsd_attr: kingdom,  type: VARCHAR(255), nullable: true, note: "書式: Kingdom.xxx" }
