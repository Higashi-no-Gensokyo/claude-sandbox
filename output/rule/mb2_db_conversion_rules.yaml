# =============================================================================
# カテゴリ3: セリフ・テキスト関連（多言語対応）
# =============================================================================

  # ---------------------------------------------------------------------------
  - name: strings
    source_xsd: GameText.xsd
    source_path: strings/string
    relationship: root
    note: >
      language_codeはXSD上に存在しない追加カラム。
      language_data.xmlの<LanguageData id="...">の値を設定する。
      英語版(オリジナル)はlanguage_codeに固定値"English"を使用する。
    primary_key: [string_id, language_code]
    columns:
      - { name: string_id,      xsd_attr: id,   type: VARCHAR(255), nullable: false, pk_order: 1 }
      - { name: language_code,  type: VARCHAR(255), nullable: false, pk_order: 2, note: "language_data.xmlのLanguageData@id値" }
      - { name: text,           xsd_attr: text, type: TEXT,         nullable: false }

  # ---------------------------------------------------------------------------
  - name: string_tags
    source_xsd: GameText.xsd
    source_path: strings/string/tags/tag
    relationship: "1:N"
    parent: strings
    primary_key: [string_id, language_code, tag_name]
    columns:
      - { name: string_id,      type: VARCHAR(255), nullable: false, pk_order: 1, fk: "strings(string_id,language_code)" }
      - { name: language_code,  type: VARCHAR(255), nullable: false, pk_order: 2, fk: "strings(string_id,language_code)" }
      - { name: tag_name,       xsd_attr: tag_name, type: VARCHAR(255), nullable: false, pk_order: 3 }
      - { name: weight,         xsd_attr: weight,   type: INT,          nullable: true }
